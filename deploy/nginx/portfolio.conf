# Portfolio — reverse proxy vers le serveur Node (PM2, 127.0.0.1:3007)
# À copier dans /etc/nginx/sites-available/portfolio.conf
# Le domaine passe par Cloudflare (mode SSL strict) : le certificat Let's Encrypt
# ci-dessous est celui que Cloudflare vérifie côté serveur.

server {
    listen 80;
    listen [::]:80;
    server_name portfolio-schmitt.neoheberg.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://portfolio-schmitt.neoheberg.fr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portfolio-schmitt.neoheberg.fr;

    ssl_certificate     /etc/letsencrypt/live/portfolio-schmitt.neoheberg.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio-schmitt.neoheberg.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass         http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
